    enunciado: Gradiente y hessiano de la superficie en función de los parámetros
    lado: publico
  - id: a1
    enunciado: Anular el gradiente en el punto determina el parámetro del término cruzado
    lado: a
    depende_de:
    - p0
  - id: a2
    enunciado: Con ese parámetro, el hessiano clasifica el punto como mínimo local
    lado: a
    depende_de:
    - a1
  - id: b1
    enunciado: El valor en el origen fija el término independiente
    lado: b
    depende_de:
    - p0
  - id: c1
