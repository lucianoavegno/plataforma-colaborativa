codigo: edo-lineal-condiciones
titulo: La ecuación y sus condiciones iniciales, por separado
area: edo
subtema: EDO lineal de segundo orden con coeficientes constantes
dificultad_declarada: 3
enunciado_publico: Una magnitud $y(t)$ satisface una ecuación diferencial lineal homogénea
  de segundo orden con coeficientes constantes. Hallar la expresión explícita de $y(t)$.
dato_a: La ecuación que gobierna el sistema es $y'' - 3y' + 2y = 0$.
dato_b: Las condiciones iniciales del sistema son $y(0) = 2$ y $y'(0) = 3$.
respuesta_canonica: exp(t) + exp(2*t)
tipo_respuesta: expresion
resolucion_latex: |-
  **Del dato A — solución general.** La ecuación característica es

  $$
  r^2 - 3r + 2 = 0 \implies (r-1)(r-2) = 0 \implies r_1 = 1,\ r_2 = 2.
  $$

  Como las raíces son reales y distintas, la solución general es

  $$
  y(t) = c_1 e^{t} + c_2 e^{2t}.
  $$

  Con esto solo quedan dos constantes libres: hay infinitas soluciones.

  **Del dato B — determinar las constantes.**

  $$
  y(0) = c_1 + c_2 = 2,
  $$

  $$
  y'(t) = c_1 e^t + 2c_2 e^{2t} \implies y'(0) = c_1 + 2c_2 = 3.
  $$

  Restando la primera de la segunda: $c_2 = 1$, y entonces $c_1 = 1$.

  $$
  \boxed{y(t) = e^{t} + e^{2t}}
  $$

  **Verificación:** $y' = e^t + 2e^{2t}$, $y'' = e^t + 4e^{2t}$, y

  $$
  y'' - 3y' + 2y = (1-3+2)e^t + (4-6+2)e^{2t} = 0 \ \checkmark
  $$

  con $y(0)=2$ e $y'(0)=3$.

  Las condiciones iniciales solas no dicen nada sobre la dinámica; la ecuación sola no selecciona una trayectoria.
