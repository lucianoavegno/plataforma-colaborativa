# Migraciones del esquema. El esquema NO se crea al arrancar la aplicación:
# se aplica de forma explícita con `alembic upgrade head`, para que el estado
# de la base sea siempre deliberado y reproducible.
[alembic]
script_location = migraciones
prepend_sys_path = src
path_separator = os
# La URL se resuelve en migraciones/env.py desde la configuración del proyecto,
# para no duplicarla acá.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = consola

[formatters]
keys = generico

[logger_root]
level = WARN
handlers = consola
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_consola]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generico

[formatter_generico]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
