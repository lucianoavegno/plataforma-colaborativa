[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cps-plataforma"
version = "1.0.0"
description = "Instrumento experimental para el estudio de la resolucion colaborativa de problemas con particion de informacion"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luciano Avegno Cepeda", email = "lucianoavegno@gmail.com" }]
keywords = ["collaborative-problem-solving", "information-asymmetry", "educational-research"]

dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "SQLAlchemy>=2.0.51",
    "alembic>=1.13",
    "pydantic>=2.13",
    "pydantic-settings>=2.0",
    "email-validator>=2.3",
    "python-multipart>=0.0.32",
    "bcrypt>=5.0",
    "PyJWT>=2.13",
    "anthropic>=0.120",
    "sympy>=1.12",
    "antlr4-python3-runtime>=4.11,<4.12",  # requerido por sympy.parsing.latex
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6", "httpx>=0.28"]
analisis = ["numpy>=2", "scipy>=1.14"]

[project.scripts]
cps = "cps.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "propiedad: verifica una propiedad formal enunciada en el marco teorico",
    "lento: requiere red o muchas iteraciones",
]

[tool.coverage.run]
source = ["cps"]
omit = ["*/cli/*", "*/api/app.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # el dominio se nombra en castellano

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Depends() en los argumentos por defecto es el idiom de FastAPI: la llamada se
# evalúa una vez al definir la ruta, que es exactamente lo que se busca.
"src/cps/api/*" = ["B008"]
# Script de migración de un solo uso: los literales del DAG anotado son largos
# por naturaleza y partirlos los volvería menos legibles, no más.
"scripts/migrar_banco_v0.py" = ["E501"]
